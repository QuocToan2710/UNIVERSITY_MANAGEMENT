name: Backend CI

on:
  push:
    branches: [ "main", "ToanDev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: ./mvnw -B clean test
