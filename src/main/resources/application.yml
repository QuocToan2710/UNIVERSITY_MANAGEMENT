logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    web: DEBUG
    org.springframework.web.socket.messaging: WARN
    org.springframework.boot.web.embedded.tomcat: INFO
    org.springframework.boot.web.context: INFO
    org.apache.kafka: ERROR
    #    org.springframework.cache: DEBUG
    #    org.springframework.cache.interceptor: TRACE
    #    org.springframework.security: DEBUG
    #    org.springframework.security.web: DEBUG
    #    org.postgresql: DEBUG
    #    org.hibernate.SQL: DEBUG
    #    org.hibernate.type.descriptor.sql: DEBUG
    #    org.hibernate.orm.jdbc.bind: trace
    com.zaxxer.hikari: DEBUG
  #    org.springframework.messaging: WARN

spring:
  application:
    name: university-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/university}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  signer-key: ${JWT_SIGNER_KEY:2c0306580240c4c6df087492195a8bd95a8dfa0d646f7c48cf89dbc8621ba226}
  valid-duration: 3600
  refreshable-duration: 360000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4173}