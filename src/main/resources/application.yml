server:
  port: ${PORT:8080}
  max-http-request-header-size: 65536

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    web: INFO
    org.springframework.web.socket.messaging: WARN
    org.springframework.boot.web.embedded.tomcat: INFO
    org.springframework.boot.web.context: INFO
    org.springframework.data.repository.config: WARN
    org.hibernate.tool.schema: ERROR
    org.apache.kafka: ERROR
    com.zaxxer.hikari: INFO

spring:
  application:
    name: university-management

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/university?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

#    url: ${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/university?sslMode=REQUIRED}
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: ${DB_USERNAME:}
#    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  mail:
    # Gmail SMTP Configuration
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    # Brevo SMTP Configuration (Dự phòng)
    # host: ${MAIL_HOST:smtp-relay.brevo.com}
    # port: ${MAIL_PORT:587}
    # username: ${MAIL_USERNAME:your-brevo-smtp-username}
    # password: ${MAIL_PASSWORD:your-brevo-smtp-key}

      # Mailtrap Sandbox Configuration (Mock test)
      # host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
      # port: ${MAIL_PORT:2525}
      # username: ${MAIL_USERNAME:2235038cf122a4}
    # password: ${MAIL_PASSWORD:e28331fa0b46a4}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  signer-key: ${JWT_SIGNER_KEY:2c0306580240c4c6df087492195a8bd95a8dfa0d646f7c48cf89dbc8621ba226}
  valid-duration: 86400
  refreshable-duration: 360000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4173}

app:
  init-data:
    enabled: ${INIT_DATA_ENABLED:true}
  mail:
    from-email: ${MAIL_FROM_EMAIL:phamtoan27102003@gmail.com}
    from-name: ${MAIL_FROM_NAME:Hệ Thống Đào Tạo Đại Học}
    brevo-api-key: ${BREVO_API_KEY:}